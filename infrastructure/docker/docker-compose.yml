version: '3.8'

services:
  # PostgreSQL 16 with PostGIS 3.4 Spatial Engine
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: uytop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-uytop_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - uytop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 In-Memory Cache & Rate Limiting
  redis:
    image: redis:7.2-alpine
    container_name: uytop-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - uytop_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Core API Backend
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: uytop-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-uytop_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-uytop_production_jwt_secret_key_2026}
    ports:
      - "4000:4000"

  # React 18 + Vite + Nginx Frontend
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: uytop-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  uytop_pgdata:
  uytop_redisdata:
