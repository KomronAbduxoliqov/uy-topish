version: '3.8'

services:
  # 1. PostgreSQL 16 Database (Production)
  db:
    image: postgres:16-alpine
    container_name: uytop-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-uytop_prod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD_IS_REQUIRED}
      POSTGRES_DB: ${DB_NAME:-uytop_prod_db}
    volumes:
      - uytop_prod_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-uytop_prod_user} -d ${DB_NAME:-uytop_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2048M

  # 2. Redis 7 Cache & Rate Limiting (Production with Password & AOF)
  redis:
    image: redis:7.2-alpine
    container_name: uytop-prod-redis
    restart: always
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD_IS_REQUIRED}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - uytop_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD_IS_REQUIRED}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # 3. NestJS Core API Backend (Production)
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: uytop-prod-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-uytop_prod_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-uytop_prod_db}
      DB_POOL_MAX: 30
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD_IS_REQUIRED}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_IS_REQUIRED}
      ALLOWED_ORIGINS: "https://uytop.uz,https://www.uytop.uz,https://staging.uytop.uz"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M

  # 4. Next.js App Router Frontend (Production)
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: uytop-prod-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_SITE_URL: https://uytop.uz
      NEXT_PUBLIC_YANDEX_MAP_KEY: ${NEXT_PUBLIC_YANDEX_MAP_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/uz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M

  # 5. Production Nginx Gateway with SSL & Rate Limiting
  nginx:
    image: nginx:1.25-alpine
    container_name: uytop-prod-nginx
    restart: always
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - uytop_certbot_www:/var/www/certbot:ro

volumes:
  uytop_prod_pgdata:
  uytop_prod_redisdata:
  uytop_certbot_www:
