# Rate limiting zone: 10 requests/second per IP for API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

upstream nextjs_production {
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream nestjs_production {
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP — Redirect all traffic to HTTPS (301 Moved Permanently)
server {
    listen 80;
    listen [::]:80;
    server_name uytop.uz www.uytop.uz;

    # ACME-challenge for Let's Encrypt SSL renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://uytop.uz$request_uri;
    }
}

# HTTPS — Production UyTop Gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uytop.uz www.uytop.uz;

    # SSL Certificates (Let's Encrypt / Production Certs)
    ssl_certificate /etc/letsencrypt/live/uytop.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uytop.uz/privkey.pem;

    # Modern TLS Security & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS & Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Max upload size for property photos
    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # Next.js Static Cache Optimization
    location /_next/static/ {
        proxy_pass http://nextjs_production;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js Public Assets
    location /public/ {
        proxy_pass http://nextjs_production;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # NestJS API — Rate-limited Auth endpoints
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://nestjs_production;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NestJS API — Core Endpoints
    location /api/ {
        limit_req zone=api_limit burst=25 nodelay;
        proxy_pass http://nestjs_production;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js SSR / App Router Discovery Pages
    location / {
        proxy_pass http://nextjs_production;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
