services:
  # ==============================================================================
  # 1. NestJS Backend API Service
  # ==============================================================================
  - type: web
    name: uytop-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.12.2
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: uytop-postgres
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DB_SYNCHRONIZE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        value: https://uytop-web.onrender.com,http://localhost:3000
      - key: ENABLE_SWAGGER
        value: "true"

  # ==============================================================================
  # 2. Next.js Frontend Web Service
  # ==============================================================================
  - type: web
    name: uytop-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm install && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.12.2
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_API_URL
        value: https://uytop-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_SITE_URL
        value: https://uytop-web.onrender.com
      - key: NEXT_PUBLIC_YANDEX_MAP_KEY
        value: f3306db0-3796-48a0-8a47-f7037f6a73c1

# ==============================================================================
# 3. PostgreSQL Database
# ==============================================================================
databases:
  - name: uytop-postgres
    plan: free
    region: frankfurt
    databaseName: uytop_db
    user: uytop_user
