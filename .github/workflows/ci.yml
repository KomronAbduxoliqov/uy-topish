name: UyTop Production CI Test & Build Pipeline

on:
  push:
    branches: [main, develop, migration/nextjs]
  pull_request:
    branches: [main, develop, migration/nextjs]

jobs:
  test-and-validate:
    name: Lint, Typecheck, Unit Tests & Next.js Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uytop_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Workspace Verification
        run: npm run typecheck

      - name: Build Shared Types Package
        run: npm run build --workspace=@uytop/shared-types

      - name: Frontend Unit & Behavior Tests (Vitest)
        run: npm run test:web

      - name: Backend Unit & AI Tests (Jest)
        run: npm run test:api

      - name: Spatial Geo & API Integration Tests
        run: npm run test:integration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: uytop_test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: uytop_ci_test_jwt_secret

      - name: Build Next.js Web Frontend & NestJS Core API
        run: |
          npm run build --workspace=@uytop/api
          npm run build --workspace=@uytop/web
