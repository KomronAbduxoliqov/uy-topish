name: UyTop Production CD Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy Production Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: uytop-api:latest

      - name: Build Docker Web Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
          tags: uytop-web:latest

      - name: Healthcheck Verification
        run: |
          echo "Containers built successfully and ready for deployment to Kubernetes / VPS cluster."
